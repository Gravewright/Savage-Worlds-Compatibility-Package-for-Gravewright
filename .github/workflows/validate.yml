name: Validate system
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHON_DOTENV_DISABLED: '1'
  UV_CACHE_DIR: ${{ github.workspace }}/host-vtt/data/runner/cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/host-vtt/data/runner/python
  UV_PYTHON_BIN_DIR: ${{ github.workspace }}/host-vtt/data/runner/python-bin
  UV_PYTHON_INSTALL_BIN: '0'
  UV_PYTHON_INSTALL_REGISTRY: '0'
  UV_PYTHON_NO_REGISTRY: '1'
  npm_config_cache: ${{ github.workspace }}/host-vtt/data/runner/npm-cache
  GRAVEWRIGHT_TEST_HOST_ROOT: ${{ github.workspace }}/host-vtt
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: Gravewright/gravewright
          ref: db15638f65e8f9e02e28b6b7616274006a92c436
          path: host-vtt
          persist-credentials: false
      - name: Prepare installation-local temporary files
        run: |
          mkdir -p "$GRAVEWRIGHT_TEST_HOST_ROOT/data/runner/tmp"
          echo "TMPDIR=$GRAVEWRIGHT_TEST_HOST_ROOT/data/runner/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GRAVEWRIGHT_TEST_HOST_ROOT/data/runner/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GRAVEWRIGHT_TEST_HOST_ROOT/data/runner/tmp" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: uv sync --project host-vtt --locked --no-dev
      - name: Test browser rules and original action decks
        run: |
          npm test
          node --test scripts/cards/test_decks.mjs
          host-vtt/.venv/bin/python -m unittest discover -s scripts/cards -p test_raster.py -v
      - name: Build and check the single system archive
        run: |
          python scripts/build.py
          python scripts/validate_package.py
          git diff --exit-code -- locales.json
      - name: Test package isolation and original VTT 0.2.3 contracts
        run: |
          python -m unittest discover -s tests -p test_package.py -v
          host-vtt/.venv/bin/python tests/run_host_tests.py
